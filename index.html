<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oliver’s birds — Life list</title>
  <meta name="description" content="Oliver’s bird life list and photo album.">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" as="image" href="generated/images/Rainbow_Bee_eater/1-large.webp" imagesrcset="generated/images/Rainbow_Bee_eater/1-small.webp 480w, generated/images/Rainbow_Bee_eater/1-large.webp 1600w" imagesizes="(max-width: 700px) calc(100vw - 70px), 44vw" fetchpriority="high">
  <script src="birds-data.js" defer></script>
  <script src="image-manifest.js" defer></script>
  <script src="album-picks.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div id="bird-scrapbook">
    <div class="scrapbook-website">
      <div class="scrapbook-book">
        <header class="scrapbook-header">
          <a class="title-scrap" href="#life-list" data-page="life"><h1>Oliver’s birds</h1></a>
          <nav class="site-nav" aria-label="Primary">
            <a href="#life-list" data-page="life" aria-current="page">Life list</a>
            <a href="#album" data-page="album">Photo album</a>
          </nav>
          <a class="instagram-link" href="https://www.instagram.com/oliver.bird.photography/" target="_blank" rel="noopener noreferrer">Instagram</a>
        </header>
        <main id="content">
          <div id="home-view">
            <section class="controls" aria-label="Search and filters">
              <label class="search-control">Search<input type="search" id="search-input" placeholder="Bird or place" autocomplete="off"></label>
              <label class="sort-control">Sort<select id="sort-select"><option value="dateDesc">Newest first</option><option value="dateAsc">Oldest first</option><option value="alphaAsc">A to Z</option><option value="alphaDesc">Z to A</option></select></label>
              <div class="region-filters" id="region-filters" aria-label="Filter by region"></div>
            </section>
            <section class="life-spread" id="life-page" aria-label="Life list">
              <div class="ledger-shadow"><div class="ledger">
                <div class="ledger-heading"><h2>Life list</h2><span id="result-count" role="status"></span></div>
                <div class="bird-records" id="bird-list"></div>
                <p class="empty-state" id="empty-state" hidden>No birds found.</p>
                <nav class="list-pagination" aria-label="Life list pages"><button type="button" class="paper-button" id="list-previous">Previous</button><span id="list-page-label"></span><button type="button" class="paper-button" id="list-next">Next</button></nav>
              </div></div>
              <aside class="pasted-photos" aria-label="Selected bird">
                <span class="feature-callout" aria-hidden="true">Click Me!<svg viewBox="0 0 76 50" fill="none" focusable="false"><path d="M4 10C31 1 49 15 60 42M48 35L60 42L62 28"/></svg></span>
                <figure class="featured-print print">
                  <span class="tape tape-left" aria-hidden="true"></span><span class="tape tape-right" aria-hidden="true"></span>
                  <button class="feature-image" id="selected-bird-button" type="button" aria-label="Open Rainbow Bee-eater"><img id="selected-bird-image" alt="Rainbow Bee-eater" width="3228" height="2152" fetchpriority="high" decoding="async"><span class="image-placeholder" hidden>No photos yet</span></button>
                  <figcaption id="selected-bird-name">Rainbow Bee-eater</figcaption>
                </figure>
                <a class="album-photo print" href="#album" data-page="album"><span class="tape" aria-hidden="true"></span><img src="generated/images/Tawny_Frogmouth/1-small.webp" width="480" height="720" alt="" loading="lazy" decoding="async"><span>Photo album</span></a>
              </aside>
            </section>
            <section class="album-page" id="album-page" aria-label="Photo album" hidden>
              <div class="album-heading"><div class="page-heading torn-label"><h2>Photo album</h2></div><span id="album-count" role="status"></span></div>
              <div class="album-photos" id="album-photos"></div>
              <p class="empty-state" id="album-empty" hidden>No photos found.</p>
            </section>
          </div>
          <section class="bird-detail" id="bird-detail-page" aria-labelledby="bird-name" hidden>
            <div class="detail-actions"><button type="button" class="paper-button" id="back-button">Back to life list</button><button type="button" class="paper-button" id="detail-random-bird-button">Random bird</button></div>
            <div class="detail-spread">
              <div class="detail-notes ledger-shadow"><div class="ledger">
                <h2 id="bird-name"></h2>
                <dl class="sighting-details"><dt>First seen</dt><dd id="bird-date"></dd><dt>Location</dt><dd id="bird-location"></dd><dt>Region</dt><dd id="bird-region"></dd><dt>Family</dt><dd id="detail-group"></dd></dl>
                <p id="bird-description" hidden></p>
                <span id="photo-count"></span>
              </div></div>
              <div class="detail-photos" id="bird-carousel"></div>
            </div>
          </section>
        </main>
        <footer class="collection-notes" aria-labelledby="collection-notes-title">
          <h2 id="collection-notes-title">Collection notes</h2>
          <div class="insight-panels">
            <section aria-labelledby="timeline-title"><h3 id="timeline-title">Lifers per month</h3><div class="timeline-bars" id="timeline-bars"></div></section>
            <section aria-labelledby="sites-title"><h3 id="sites-title">Lifers per location</h3><ul class="site-list" id="site-list"></ul></section>
          </div>
        </footer>
        <noscript><p>This list needs JavaScript to show the bird records and photos.</p></noscript>
      </div>
      <span class="screen-reader" id="announcement" role="status" aria-live="polite"></span>
    </div>
  </div>
  <dialog class="photo-viewer" id="image-modal" aria-label="Bird photo viewer">
    <div class="viewer-toolbar"><div class="viewer-actions"><button type="button" class="paper-button" id="modal-details">Bird details</button><a class="paper-button" id="modal-original" target="_blank" rel="noopener noreferrer">Original</a></div><button type="button" class="paper-button" id="close-modal" aria-label="Close photo viewer">Close</button></div>
    <figure class="viewer-print"><img id="modal-img" alt=""><figcaption id="modal-caption"></figcaption></figure>
    <div class="viewer-controls"><button type="button" class="paper-button" id="modal-prev" aria-label="Previous photo">Previous</button><span id="modal-position" aria-live="polite"></span><button type="button" class="paper-button" id="modal-next" aria-label="Next photo">Next</button></div>
  </dialog>
</body>
</html>
